# Docker Compose configuration for data-download-drivers
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/data-download-drivers:latest
    container_name: data-download-drivers
    restart: unless-stopped

    ports:
      - "127.0.0.1:8831:8831"
    volumes:
      - /srv/appdata/data-download-drivers/drivers:/drivers:ro
      - /srv/datasets:/datasets
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      DRIVER_HOST_PORT: ${DRIVER_HOST_PORT:-8831}
      DATA_DOWNLOAD_DRIVERS_DIR: ${DATA_DOWNLOAD_DRIVERS_DIR:-/drivers}
      DATA_DOWNLOAD_DATASETS_DIR: ${DATA_DOWNLOAD_DATASETS_DIR:-/datasets}
      DATABENTO_API_KEY: ${DATABENTO_API_KEY}

    networks:
      - data-download-internal
networks:
  data-download-internal:
    external: true
